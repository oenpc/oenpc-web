# OENPC-WEB 站点配置（A 机 nginx）
#
# 部署形态：**A 机放静态产物 + 反代，B 机跑 node 应用**。
# 静态产物：前台 SSG 在 /var/www/oenpc-web/site，后台 SPA 在 /var/www/oenpc-web/admin。
# 需要反代到 B 机的路径：/api/ 与 /media/。
#
# ★ 本文件的 location 顺序是**有讲究的**，见每段注释 ——
#   nginx 的前缀匹配不是"从上往下第一个命中"，行为由修饰符决定，
#   而顺序错了的症状是"静态页看起来能打开，接口却返回 HTML"。

upstream oenpc_web_app {
    # B 机地址。用内网地址，**不要**把应用端口暴露到公网。
    server 10.0.0.2:3900;
    keepalive 16;
}

server {
    listen 80;
    # 换成你的域名。多个域名用空格分隔。
    server_name trade.example.com;

    root /var/www/oenpc-web/site;
    index index.html;

    # 日志：默认格式会把完整 URL 记下来，而订阅/下载类链接的 token 在 URL 里。
    # 本项目的公开页面 URL 不含凭据，所以用默认格式即可；
    # 将来若出现带 token 的路径，要单独 access_log off。

    # ─────────────────────────────────────────────────────────────
    # 1) 接口与媒体：必须**先于** SPA 回落匹配
    #
    # 用 `^~` 前缀匹配（命中后不再尝试正则），且必须写在 `location /` 之前。
    # 若漏了这两段，`location /` 的 try_files 会把 /api/xxx 回落到 index.html ——
    # 前端拿到的是 HTML 而不是 JSON，报错是 "Unexpected token '<'"，
    # 看起来像前端解析 bug，实际是反向代理配置漏了。
    # ─────────────────────────────────────────────────────────────

    location ^~ /api/ {
        proxy_pass http://oenpc_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 上传大小：nginx 默认只有 1m，任何图片上传都会在这里被 413 拦掉，
        #   **根本到不了应用**。这与后端的 10MB 上限必须同时放开
        #   （硬约束 upload-limits-both-sides）。
        client_max_body_size 12m;
        # 不要让 nginx 先把整个上传写进自己的临时目录（双倍磁盘 IO + 双倍延迟）
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /media/ {
        proxy_pass http://oenpc_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 媒体是静态内容且带 immutable 缓存头，让 nginx 缓存一份更好
        proxy_cache_valid 200 1h;
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────────────────────────────
    # 2) 后台 SPA：挂在 /admin/
    #
    # ★ 必须与 apps/admin/vite.config.ts 的 `base: '/admin/'` 一致。
    #   不一致时资源请求会落到前台站点，浏览器报
    #   "Unexpected token '<'"（把前台 HTML 当 JS 解析）。
    # ─────────────────────────────────────────────────────────────
    location ^~ /admin/ {
        alias /var/www/oenpc-web/admin/;
        # history 路由：未命中的路径回落到后台自己的 index.html
        try_files $uri $uri/ /admin/index.html;
    }

    # 后台不应被搜索引擎收录（index.html 里也有 noindex meta，这里再加一道）
    location = /admin/robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /admin/\n";
    }

    # ─────────────────────────────────────────────────────────────
    # 3) SEO 文件：必须精确匹配，否则会被当成普通静态文件
    #    （它们其实也是静态文件，这里显式写出是为了可读性与后续加缓存头）
    # ─────────────────────────────────────────────────────────────
    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }

    # ─────────────────────────────────────────────────────────────
    # 4) 前台站点：最后一档，history 回落
    #
    # 放在最后是因为它是唯一会"吞掉一切"的规则。
    # 前台是 SSG，每个页面都有真实文件，所以回落到 index.html 的情况很少，
    # 但保留它可以让 /en/products 这类不带尾斜杠的访问自动补齐。
    # ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
