# OENPC-WEB 站点配置
#
# ┌─ A 机 172.19.3.47 ──────────────┐        ┌─ B 机 172.19.229.191 ──────────┐
# │ nginx（本文件）                  │        │ node 应用 + SQLite + 媒体文件   │
# │  /        前台 SSG 静态产物       │ 反代   │  监听 172.19.229.191:3900       │
# │  （无 /admin/ —— 后台在 B 机）     │───────►│  /api/  /media/                 │
# └─────────────────────────────────┘        └────────────────────────────────┘
#
# 安装：sudo cp deploy/nginx.conf /etc/nginx/conf.d/oenpc-web.conf
#       sudo nginx -t && sudo systemctl reload nginx
#
# ★ 本文件的 location 顺序是**有讲究的**，见每段注释 ——
#   顺序或修饰符错了，症状是"静态页看起来能打开，接口却返回 HTML"。

upstream oenpc_web_app {
    # B 机内网地址。应用必须监听这个地址（不能是 127.0.0.1）——
    # 见 .env 的 OENPC_WEB_HOST 说明。
    server 172.19.229.191:3900;
    keepalive 16;
}

server {
    listen 80;

    # 当前没有域名，用 IP 访问，所以 server_name 用通配。
    # 将来绑了域名，改成域名（多个用空格分隔），并把下面的 SITE_URL 一起改掉后**重建前台**。
    server_name _;

    # A 机上的静态产物目录
    root /var/www/oenpc-web/site;
    index index.html;

    # ─────────────────────────────────────────────────────────────
    # 1) 接口与媒体：必须**先于** SPA 回落匹配
    #
    # 用 `^~` 前缀匹配（命中后不再尝试正则），且必须写在 `location /` 之前。
    # 若漏了这两段，`location /` 的 try_files 会把 /api/xxx 回落到 index.html ——
    # 前端拿到 HTML 而不是 JSON，报错是 "Unexpected token '<'"，
    # 看起来像前端解析 bug，实际是反向代理配置漏了。
    # ─────────────────────────────────────────────────────────────

    location ^~ /api/ {
        proxy_pass http://oenpc_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 上传大小：nginx 默认只有 1m，任何图片上传都会在这里被 413 拦掉，
        #   **根本到不了应用**。这与后端 10MB 的上限必须同时放开
        #   （硬约束 upload-limits-both-sides）。这里给 12m 留出 multipart 边界余量。
        client_max_body_size 12m;
        # 不要让 nginx 先把整个上传写进自己的临时目录（双倍磁盘 IO + 双倍延迟）
        proxy_request_buffering off;
        # 上传大图耗时可能超过默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /media/ {
        proxy_pass http://oenpc_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;

        # 图片响应自带 `Cache-Control: public, max-age=31536000, immutable`
        # （因为每次上传都生成新 id，同一 URL 的内容永不改变），
        # 所以浏览器侧已经缓存得很彻底，这里不需要再做 nginx 层缓存。
        #
        # 若要加 nginx 缓存，必须在 **http 块**里先定义 proxy_cache_path —
        # 只写 proxy_cache_valid 是无效的（它会静默不生效，看起来像"缓存没命中"）。
    }

    # ─────────────────────────────────────────────────────────────
    # 2) 后台 SPA **不在 A 机**
    #
    # 本项目的部署形态是「A 机只跑前台站点，B 机跑 admin + server」，
    # 所以后台界面由 B 机的应用进程在自己的根路径 /admin/ 下发出，
    # 访问地址是 http://172.19.229.191:3900/admin/（而不是本域名下的 /admin/）。
    #
    # 早期版本在这里配了 alias /var/www/oenpc-web/admin/ —— 那是把后台也放到 A 机
    # 才成立的写法。**不要**在这里加 /admin/ 段：A 机上没有后台产物，
    # 加了一个 alias 指过去只会 404，且会让人以为"后台部署在 A 机"。
    # ─────────────────────────────────────────────────────────────
    # ─────────────────────────────────────────────────────────────
    # 3) SEO 文件：精确匹配，避免被当成普通静态资源
    # ─────────────────────────────────────────────────────────────
    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }

    # ─────────────────────────────────────────────────────────────
    # 4) 前台站点：最后一档
    #
    # 放在最后是因为它是唯一会"吞掉一切"的规则。
    # 前台是 SSG，每个页面都有真实文件；保留回落是为了让
    # /en/products（不带尾斜杠）这类访问也能命中。
    # ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
