# ═══════════════════════════════════════════════════════════════════════════
#  OENPC-WEB —— B 机后台站点配置（B 机 172.19.229.191）
# ═══════════════════════════════════════════════════════════════════════════
#
#  B 机跑 admin + server：应用进程监听 172.19.229.191:3900，
#  同时提供 API、媒体文件、以及后台 SPA（三者同源）。
#
#  本配置让后台可以这样访问（不必记端口）：
#      http://172.19.229.191/admin/
#  并为将来加 TLS 留好了位置（见文件末尾）。
#
#  安装：
#      sudo cp deploy/nginx-b.conf /etc/nginx/conf.d/oenpc-web-admin.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠⚠ proxy_pass 用的是 172.19.229.191，**不是 127.0.0.1**。
#     应用由 OENPC_WEB_HOST=172.19.229.191 绑定到那个具体地址，
#     **回环地址上并没有服务**（绑具体地址不服务 127.0.0.1，已实测）。
#     写 127.0.0.1 会得到 502，而 502 通常被误判成"应用挂了"。
#
#  ⚠ 若 B 机 80 端口已被另一个站点占用（`server_name` 是域名或 `_`），
#     这个 server 块会与它冲突。二选一：
#       · 把下面的 server_name 换成你自己的域名（推荐）
#       · 或换一个端口：listen 8080;  （访问 http://172.19.229.191:8080/admin/）
# ═══════════════════════════════════════════════════════════════════════════

upstream oenpc_web_admin {
    # ★ 必须是 B 机的实际监听地址，不能是 127.0.0.1（见文件头说明）
    server 172.19.229.191:3900;
    keepalive 16;
}

server {
    listen 80;
    # 有域名就写域名（多个用空格分隔）。暂时没有就先按 IP 访问，用通配。
    server_name _;

    # 这个 server 块只做反代，没有自己的静态根目录。
    # 未匹配的路径一律 404 —— 避免把 B 机上别的东西意外暴露出去。
    # （后台的静态资源由应用进程在 /admin/ 下发出，不需要在这里 alias。）
    location / {
        return 404;
    }

    # ─────────────────────────────────────────────────────────────────────
    #  后台界面
    #
    #  ★ proxy_pass 结尾**不能有斜杠**：
    #      proxy_pass http://oenpc_web_admin;    正确，/admin/xxx 原样转发
    #      proxy_pass http://oenpc_web_admin/;   错误，会剥掉 /admin/ → 404
    #
    #  ★ 不需要在这里配 try_files 做 history 回落 ——
    #    应用进程自己会处理（/admin/products/<id> 这类前端路由返回 index.html）。
    #    在 nginx 里再配一次反而容易和应用的逻辑打架。
    # ─────────────────────────────────────────────────────────────────────
    location ^~ /admin/ {
        proxy_pass http://oenpc_web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────────────────
    #  接口
    #
    #  后台的登录、产品管理都走这个前缀。**同源**是必须的 ——
    #  后台页面由这个地址发出，它的 /api/ 请求也回到这里，
    #  所以 cookie/令牌与 CORS 都不成问题。
    # ─────────────────────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass http://oenpc_web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ nginx 默认只允许 1m 请求体，图片上传会在这里被 413 拦掉，
        #   **根本到不了应用**（对应硬约束 upload-limits-both-sides）。
        #   后端上限是 10MB，这里给 12m 留余量。
        client_max_body_size 12m;
        # 不让 nginx 先把整个上传写进自己的临时目录
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─────────────────────────────────────────────────────────────────────
    #  媒体文件（前台图片也靠它；A 机的 nginx 会再转发到这里）
    # ─────────────────────────────────────────────────────────────────────
    location ^~ /media/ {
        proxy_pass http://oenpc_web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        # 图片响应自带 Cache-Control: public, max-age=31536000, immutable
        # （每次上传都生成新 id，同一 URL 的内容永不改变），浏览器侧已缓存得很彻底。
    }
}

# ═══════════════════════════════════════════════════════════════════════════
#  加了域名与证书之后（推荐 —— 后台是明文传口令的，上 TLS 才算解决）
#
#  1. 申请证书，例如：
#       sudo certbot --nginx -d admin.example.com
#     certbot 会自动改写上面的 server 块并加上 443。
#
#  2. 或者手工写。80 段改成跳转，另起一个 443 段承载同样的 location：
#
#     server {
#         listen 80;
#         server_name admin.example.com;
#         return 301 https://$host$request_uri;
#     }
#
#     server {
#         listen 443 ssl;
#         http2 on;
#         server_name admin.example.com;
#
#         ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
#
#         # 这里放与上面**完全相同**的 location 段
#         # （location / 的 404、/admin/、/api/、/media/）
#     }
#
#  3. ★ 加了 TLS 之后，B 机的 .env 要同步确认：
#       OENPC_WEB_SITE_URL=https://admin.example.com   （若这个域名也对外代表站点）
#       OENPC_WEB_TRUSTED_PROXY=172.19.3.47,172.19.229.191
#     最后一项不能漏 —— 见下方"为什么 TRUSTED_PROXY 要加 B 机自己的地址"。
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
#  ★ 为什么 TRUSTED_PROXY 要包含 B 机自己的地址
#
#  B 机的 nginx 也是反向代理，应用看到的请求来源会变成它转发时的地址。
#  不配这一项的后果很具体：
#
#    · 日志里所有后台访问的来源都是同一个地址，排查时看不出是谁；
#    · **登录限流按 IP 计数 → 退化成"所有管理员共用一个计数器"** ——
#      一个人连续输错几次口令，会把其他人一起锁在门外。
#
#  所以 B 机 .env 里应当是：
#      OENPC_WEB_TRUSTED_PROXY=172.19.3.47,172.19.229.191
#                                        ↑ A 机反代   ↑ B 机自己的 nginx
#
#  可以信任这两个地址，是因为它们都是**内网固定主机**；
#  外来的请求即便伪造 X-Forwarded-For: 172.19.229.191 也不会被信任。
#
#  ⚠ 绝对不要写成 true（信任一切）：那等于任何人都能伪造来源 IP 绕过限流。
# ═══════════════════════════════════════════════════════════════════════════
